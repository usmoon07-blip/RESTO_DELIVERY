# Serverni uyg'oq ushlab turish.
#
# Bepul Render 15 daqiqa jimlikdan keyin xizmatni uxlatadi va keyingi
# mijoz 30-60 soniya kutadi. Bu ish har 10 daqiqada serverga kichik
# so'rov yuborib, uni uyg'oq ushlab turadi.
#
# Faqat restoran ish vaqtida ishlaydi (Toshkent bo'yicha 09:00-02:00),
# chunki bepul Render'da oyiga 750 soat chegara bor.

name: Serverni uyg'oq ushlash

on:
  schedule:
    # UTC 04:00-21:00 = Toshkent 09:00-02:00
    - cron: '*/10 4-21 * * *'
  workflow_dispatch: # qo'lda ham ishga tushirish mumkin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Serverga turtki
        run: |
          URL="https://resto-api-uqhs.onrender.com/api/health"

          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 90 "$URL" || echo 000)

            if [ "$code" = "200" ]; then
              echo "Server uyg'oq (urinish $attempt)"
              cat /tmp/out.txt
              exit 0
            fi

            echo "Urinish $attempt: kod $code — server uyg'onmoqda, kutamiz..."
            sleep 20
          done

          echo "Server javob bermadi. Render holatini tekshiring."
          exit 1
